openapi: 3.0.0
info:
  title: Distribution Webhook API
  version: 1.0.0
  description:
    The Medallia Distribution Webhook API allows a client to implement a webhook receiver
    to distribute Medallia Experience Cloud survey URLs via their method of choice.
  termsOfService: https://medallia.com/about/legal/terms/api
servers:
  - url: 'https://{client-api-gateway-hostname}'
    variables:
      client-api-gateway-hostname:
        default: client-api-gateway.example.com
        description:
          The client's webhook receiver gateway
paths:
  /distribute:
    post:
      summary: Receive a new survey invite to distribute
      requestBody:
        description: The survey details to distribute
        required: true
        content:
          application/cloudevents+json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DistributionRequest'
                - $ref: '#/components/schemas/AuthCheckRequest'
      responses:
        "200":
          description: The request was received and understood and processed as per the response body's details
          content:
            application/cloudevents+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DistributionUpdate'
                  - $ref: '#/components/schemas/AuthCheckResponse'
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
        "202":
          description: The request has been accepted for asynchronous processing. No response body is returned
          content:
            application/cloudevents+json:
              schema:
                $ref: '#/components/schemas/DistributionUpdate'
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - oauth: []
        - basicAuth: []
components:
  headers:
    X-RateLimit-Limit:
      description:
        Indicates the request quota closest to reaching its limit
        amongst all available quotas. Follows the semantics of
        [IETF draft-polli-ratelimit-headers](https://datatracker.ietf.org/doc/html/draft-polli-ratelimit-headers).
      schema:
        type: string
      example: 10, 10;w=1, 100;w=86400
    X-RateLimit-Remaining:
      description:
        Indicates the number of requests remaining in the quota that is
        closest to expiring (as indicated by `X-RateLimit-Limit`).
        Follows the semantics of
        [IETF draft-polli-ratelimit-headers](https://datatracker.ietf.org/doc/html/draft-polli-ratelimit-headers).
      schema:
        type: integer
      example: 10
    X-RateLimit-Reset:
      description:
        Indicates the number of seconds remaining until the quota
        resets.  Follows the semantics of
        [IETF draft-polli-ratelimit-headers](https://datatracker.ietf.org/doc/html/draft-polli-ratelimit-headers).
      schema:
        type: integer
      example: 10
  responses:
    BadRequest:
      description: Invalid request
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
    Unauthorized:
      description: Unauthorized
    Forbidden:
      description: Forbidden
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying, per RFC 7231 §7.1.3
          schema:
            type: integer
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
    NotAcceptable:
      description: Not acceptable
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
    RequestConflict:
      description: Request conflict with current state of the server
    PreconditionFailed:
      description: Precondition failed
      headers:
        ETag:
          description: Entity Tag
          schema:
            type: string
    NotSupported:
      description: Not supported
    InternalServerError:
      description: Internal server error
    NotModified:
      description: Not modified
    NoContent:
      description: Successfully deleted
    Created:
      description: Successfully created
      headers:
        ETag:
          description: Entity Tag
          schema:
            type: string
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
  schemas:
    AuthCheckRequest:
      type: object
      description: A health check request validating the authentication credentials work
      required:
        - specversion
        - id
        - source
        - type
        - data
      properties:
        specversion:
          type: string
          enum:
            - "1.0"
          description: The version of the CloudEvents spec in use
        id:
          type: string
          format: uuid
          description: The ID of the message, guaranteed to be globally unique and idempotent
          example: 1f121945-b555-4813-aeb8-dc64610cb8e9
        traceparent:
          type: string
          description: A "trace" ID that allows for tracking a string of related messages, similar to a "thread ID"
          example: diamondtel_telco_5d3e8bdf-a2b2-44ca-ae0f-f5d05be4e33d
        source:
          type: string
          enum:
            - urn:medallia:services:broadcaster
          description: The identity of the system that sourced this message
        type:
          type: string
          enum:
            - com.medallia.survey.invitation.authcheck
          description: The specific message type
        time:
          type: string
          format: date-time
          description: The timestamp of the message's creation    
    AuthCheckResponse:
      type: object
      description: A status message indicating whether the authentication credentials worked
      required:
        - specversion
        - id
        - source
        - type
        - data
      properties:
        specversion:
          type: string
          enum:
            - "1.0"
          description: The version of the CloudEvents spec in use
        id:
          type: string
          format: uuid
          description: The ID of the message, guaranteed to be globally unique and idempotent
          example: 90c2e884-7484-4055-bdae-eb7126b49505
        traceparent:
          type: string
          description: Must match the traceparent value from the original DistributionRequest
          example: diamondtel_telco_5d3e8bdf-a2b2-44ca-ae0f-f5d05be4e33d
        source:
          type: string
          enum:
            - urn:client:webhook
          description: The identity of the system that sourced this message
        type:
          type: string
          enum:
            - com.medallia.survey.invitation.authcheck.success
            - com.medallia.survey.invitation.authcheck.error
          description: The specific message type
          example: com.medallia.survey.invitation.delivery.failed
        dataschema:
          type: string
          enum:
            - https://cdn.medallia.com/cloudevents-schemas/broadcaster-webhook-invitation-update/v1.json
        time:
          type: string
          format: date-time
          description: The timestamp of the message's creation
        datacontenttype:
          type: string
          enum:
            - application/json
          description: The MIME content type of the "data" payload
        subject:
          type: string
          description: An optional field that may be used for filtering or routing
        data:
          type: object
          required:
            - message_id
          properties:
            debug_info:
              oneOf:
                - type: object
                  description: Any additional information that could be helpful to debugging or tracing
                  additionalProperties: true
                  example:
                    external_ip: "1.2.3.4"
                    sys_log_rqst_id: "1234-5678-90abcdef"
                - type: array
                  description: Any additional information that could be helpful to debugging or tracing
                  items:
                    type: object
                    additionalProperties: true
                    example:
                      external_ip: "1.2.3.4"
                      sys_log_rqst_id: "1234-5678-90abcdef"
    DistributionRequest:
      type: object
      required:
        - specversion
        - id
        - source
        - type
        - data
      properties:
        specversion:
          type: string
          enum:
            - "1.0"
          description: The version of the CloudEvents spec in use
        id:
          type: string
          format: uuid
          description: The ID of the message, guaranteed to be globally unique and idempotent
          example: 1f121945-b555-4813-aeb8-dc64610cb8e9
        traceparent:
          type: string
          description: A "trace" ID that allows for tracking a string of related messages, similar to a "thread ID"
          example: 00-5d3e8bdfa2b244caae0ff5d05be4e33d-597576596e36d40e-01
        source:
          type: string
          enum:
            - urn:medallia:services:broadcaster
          description: The identity of the system that sourced this message
        type:
          type: string
          enum:
            - com.medallia.survey.invitation
          description: The specific message type
        dataschema:
          type: string
          enum:
            - https://cdn.medallia.com/cloudevents-schemas/broadcaster-webhook-invitation/v1.json
        time:
          type: string
          format: date-time
          description: The timestamp of the message's creation
        datacontenttype:
          type: string
          enum:
            - application/json
          description: The MIME content type of the "data" payload
        subject:
          type: string
          description: An optional field that can contain additional information helpful to track this message
        data:
          type: object
          description: The details of the survey invitation to distribute
          required:
            - record_type
            - survey_id
            - survey_url
            - contact_id
            - expiration_timestamp
            - callback
          properties:
            record_type:
              type: string
              description: A prompt that informs the server as to whether this is "live" traffic or "preview" traffic
              enum:
                - live
                - preview
            survey_id:
              type: string
              description: The Medallia-internal record ID that identifies this survey record
            survey_url:
              type: string
              format: uri
              description: The URL that engages the recipient with the survey
              example: https://survey.medallia.com/example-survey-id-here
            contact_id:
              type: string
              description: Some ID that uniquely identifies the contact, typically an email address, loyalty number, phone number, or similar
            preferred_locale:
              type: string
              description: The BCP 47 language/locale code that Medallia believes the recipient prefers based on metadata available
              example: en-US
            messages:
              type: array
              description:
                A list of messages, identified by their BCP 47 language/locale code, that the webhook can leverage in
                distributing the invitation.  This may be omitted, empty, or not contain a specific BCP 47
                language/locale code; it is up to the webhook to determine how to handle these scenarios properly.
                It is recommended that the webhook always implement a graceful fallback for such scenarios.
              items:
                type: object
                required:
                  - locale
                properties:
                  locale:
                    type: string
                    description: The BCP 47 language/locale code that matches the message content
                    example: en-US
                  summary:
                    type: string
                    description: A "short form" of the invitation message
                    example: Thanks for your visit!  How did it go?
                  details:
                    type: string
                    description: A "long form" of the invitation message
                    example: Thank you for visiting our Orion branch location.  We would love your input on how we did.  Would you take 2 minutes to give us feedback?
            expiration_timestamp:
              type: string
              format: date-time
              description: The time after which the survey invitation is expired
            additional_data:
              type: object
              additionalProperties: true
              description: A set of key-value pairs that capture additional metadata about the record that could be helpful in the delivery of the invitation
              example:
                masked_url: "https://survey.example.com"
                contact_id: "abc123"
            callback:
              type: string
              format: uri
              description: A callback URL that can be used to update the record within MEC based on delivery-related triggers
              example: https://example-api-gateway.medallia.com/path/status
    DistributionUpdate:
      type: object
      description: A status update message from the client's webhook receiver back to Medallia
      required:
        - specversion
        - id
        - source
        - type
        - data
      properties:
        specversion:
          type: string
          enum:
            - "1.0"
          description: The version of the CloudEvents spec in use
        id:
          type: string
          format: uuid
          description: The ID of the message, guaranteed to be globally unique and idempotent
          example: 90c2e884-7484-4055-bdae-eb7126b49505
        traceparent:
          type: string
          description: Must match the traceparent value from the original DistributionRequest
          example: 00-5d3e8bdfa2b244caae0ff5d05be4e33d-597576596e36d40e-01
        source:
          type: string
          enum:
            - urn:client:webhook
          description: The identity of the system that sourced this message
        type:
          type: string
          enum:
            - com.medallia.survey.invitation.delivery.queued
            - com.medallia.survey.invitation.delivery.sent
            - com.medallia.survey.invitation.delivery.failed
            - com.medallia.survey.invitation.delivery.delivered
            - com.medallia.survey.invitation.delivery.optout
          description: The specific message type
          example: com.medallia.survey.invitation.delivery.failed
        dataschema:
          type: string
          enum:
            - https://cdn.medallia.com/cloudevents-schemas/broadcaster-webhook-invitation-update/v1.json
        time:
          type: string
          format: date-time
          description: The timestamp of the message's creation
        datacontenttype:
          type: string
          enum:
            - application/json
          description: The MIME content type of the "data" payload
        subject:
          type: string
          description: An optional field that may be used for filtering or routing
        data:
          type: object
          required:
            - message_id
          properties:
            message_id:
              type: string
              format: uuid
              description: Must match the id value from the original DistributionRequest
            debug_info:
              oneOf:
                - type: object
                  description: Any additional information that could be helpful to debugging or tracing
                  additionalProperties: true
                  example:
                    external_ip: "1.2.3.4"
                    sys_log_rqst_id: "1234-5678-90abcdef"
                - type: array
                  description: Any additional information that could be helpful to debugging or tracing
                  items:
                    type: object
                    additionalProperties: true
                    example:
                      external_ip: "1.2.3.4"
                      sys_log_rqst_id: "1234-5678-90abcdef"
            error:
              type: object
              description: Only if the type is com.medallia.survey.invitation.delivery.failed
              required:
                - code
                - message
                - retryable
              properties:
                code:
                  type: string
                message:
                  type: string
                retryable:
                  type: boolean
  securitySchemes:
    oauth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{client-oauth-hostname}/oauth/token
          scopes: {}
    basicAuth:
      type: http
      scheme: basic
security:
  - oauth: []
  - basicAuth: []
