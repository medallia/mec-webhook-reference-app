openapi: 3.0.0
info:
  title: Distribution Status Update API
  version: 1.0.0
  description:
    The Medallia Distribution Status Update API allows a client who implemented the
    Distribution Webhook API to update the status of the invitation based on
    client-side delivery information.
  termsOfService: https://medallia.com/about/legal/terms/api
servers:
  - url: 'https://{api-gateway-hostname}'
    variables:
      api-gateway-hostname:
        default: instance-tenant.apis.medallia.com
        description:
          The Medallia Experience Cloud hostname used to access the API Gateway
paths:
  /status:
    post:
      summary: Receives a distribution status update for an invitation record
      requestBody:
        description: The status update for the distributed invitation
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/DistributionUpdate'
      responses:
        "200":
          description: The request was received and understood and processed as per the response body's details
          content:
            application/cloudevents+json:
              schema:
                $ref: '#/components/schemas/DistributionUpdateResponse'
        "202":
          description: The request was received and understood and will be processed asynchronously as per the response body's details
          content:
            application/cloudevents+json:
              schema:
                $ref: '#/components/schemas/DistributionUpdateResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
components:
  headers:
    X-RateLimit-Limit-day:
      description: The number of requests allowed in total in a 24-hour period. Deprecated as of Sept. 2022 in favor of X-RateLimit-Limit.
      schema:
        type: integer
      example: 10000
      deprecated: true
    X-RateLimit-Remaining-day:
      description: The number of requests available to make in a 24-hour period. Deprecated as of Sept. 2022 in favor of X-RateLimit-Remaining.
      schema:
        type: integer
      example: 10000
      deprecated: true
    X-RateLimit-Limit-second:
      description: The number of requests allowed in total in a 1-second period. Deprecated as of Sept. 2022 in favor of X-RateLimit-Limit.
      schema:
        type: integer
      example: 10
      deprecated: true
    X-RateLimit-Remaining-second:
      description: The number of requests available to make in a 1-second period. Deprecated as of Sept. 2022 in favor of X-RateLimit-Remaining.
      schema:
        type: integer
      example: 10
      deprecated: true
    X-RateLimit-Limit:
      description:
        Indicates the request quota closest to reaching its limit
        amongst all available quotas. Follows the semantics of
        [IETF draft-polli-ratelimit-headers](https://datatracker.ietf.org/doc/html/draft-polli-ratelimit-headers).
      schema:
        type: string
      example: 10, 10;w=1, 100;w=86400
    X-RateLimit-Remaining:
      description:
        Indicates the number of requests remaining in the quota that is
        closest to expiring (as indicated by `X-RateLimit-Limit`).
        Follows the semantics of
        [IETF draft-polli-ratelimit-headers](https://datatracker.ietf.org/doc/html/draft-polli-ratelimit-headers).
      schema:
        type: integer
      example: 10
    X-RateLimit-Reset:
      description:
        Indicates the number of seconds remaining until the quota
        resets.  Follows the semantics of
        [IETF draft-polli-ratelimit-headers](https://datatracker.ietf.org/doc/html/draft-polli-ratelimit-headers).
      schema:
        type: integer
      example: 10
    X-Medallia-Rpc-Request-Id:
      description: The request ID, used by Medallia support for troubleshooting
      schema:
        type: string
        format: uuid
      example: 94615edd-d9d0-4921-8b3e-60615b3d3431
  responses:
    BadRequest:
      description: Invalid request
      headers:
        X-RateLimit-Limit-day:
          $ref: '#/components/headers/X-RateLimit-Limit-day'
        X-RateLimit-Remaining-day:
          $ref: '#/components/headers/X-RateLimit-Remaining-day'
        X-RateLimit-Limit-second:
          $ref: '#/components/headers/X-RateLimit-Limit-second'
        X-RateLimit-Remaining-second:
          $ref: '#/components/headers/X-RateLimit-Remaining-second'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        X-Medallia-Rpc-Request-Id:
          $ref: '#/components/headers/X-Medallia-Rpc-Request-Id'
    Unauthorized:
      description: Unauthorized
    Forbidden:
      description: Forbidden
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying, per RFC 7231 §7.1.3
          schema:
            type: integer
        X-RateLimit-Limit-day:
          $ref: '#/components/headers/X-RateLimit-Limit-day'
        X-RateLimit-Remaining-day:
          $ref: '#/components/headers/X-RateLimit-Remaining-day'
        X-RateLimit-Limit-second:
          $ref: '#/components/headers/X-RateLimit-Limit-second'
        X-RateLimit-Remaining-second:
          $ref: '#/components/headers/X-RateLimit-Remaining-second'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        X-Medallia-Rpc-Request-Id:
          $ref: '#/components/headers/X-Medallia-Rpc-Request-Id'
    NotFound:
      description: Object not found
      headers:
        X-RateLimit-Limit-day:
          $ref: '#/components/headers/X-RateLimit-Limit-day'
        X-RateLimit-Remaining-day:
          $ref: '#/components/headers/X-RateLimit-Remaining-day'
        X-RateLimit-Limit-second:
          $ref: '#/components/headers/X-RateLimit-Limit-second'
        X-RateLimit-Remaining-second:
          $ref: '#/components/headers/X-RateLimit-Remaining-second'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        X-Medallia-Rpc-Request-Id:
          $ref: '#/components/headers/X-Medallia-Rpc-Request-Id'
    NotAcceptable:
      description: Not acceptable
      headers:
        X-RateLimit-Limit-day:
          $ref: '#/components/headers/X-RateLimit-Limit-day'
        X-RateLimit-Remaining-day:
          $ref: '#/components/headers/X-RateLimit-Remaining-day'
        X-RateLimit-Limit-second:
          $ref: '#/components/headers/X-RateLimit-Limit-second'
        X-RateLimit-Remaining-second:
          $ref: '#/components/headers/X-RateLimit-Remaining-second'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        X-Medallia-Rpc-Request-Id:
          $ref: '#/components/headers/X-Medallia-Rpc-Request-Id'
    RequestConflict:
      description: Request conflict with current state of the server
    PreconditionFailed:
      description: Precondition failed
      headers:
        ETag:
          description: Entity Tag
          schema:
            type: string
    NotSupported:
      description: Not supported
    InternalServerError:
      description: Internal server error
    NotModified:
      description: Not modified
    NoContent:
      description: Successfully deleted
    Created:
      description: Successfully created
      headers:
        ETag:
          description: Entity Tag
          schema:
            type: string
        X-RateLimit-Limit-day:
          $ref: '#/components/headers/X-RateLimit-Limit-day'
        X-RateLimit-Remaining-day:
          $ref: '#/components/headers/X-RateLimit-Remaining-day'
        X-RateLimit-Limit-second:
          $ref: '#/components/headers/X-RateLimit-Limit-second'
        X-RateLimit-Remaining-second:
          $ref: '#/components/headers/X-RateLimit-Remaining-second'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        X-Medallia-Rpc-Request-Id:
          $ref: '#/components/headers/X-Medallia-Rpc-Request-Id'
  schemas:
    DistributionUpdate:
      type: object
      description: A status update message from the client's webhook receiver back to Medallia
      required:
        - specversion
        - id
        - source
        - type
        - data
      properties:
        specversion:
          type: string
          enum:
            - "1.0"
          description: The version of the CloudEvents spec in use
        id:
          type: string
          format: uuid
          description: The ID of the message, guaranteed to be globally unique and idempotent
          example: 90c2e884-7484-4055-bdae-eb7126b49505
        traceparent:
          type: string
          description: Must match the traceparent value from the original DistributionRequest
          example: 00-5d3e8bdfa2b244caae0ff5d05be4e33d-597576596e36d40e-01
        source:
          type: string
          enum:
            - urn:client:webhook
          description: The identity of the system that sourced this message
        type:
          type: string
          enum:
            - com.medallia.survey.invitation.delivery.queued
            - com.medallia.survey.invitation.delivery.sent
            - com.medallia.survey.invitation.delivery.failed
            - com.medallia.survey.invitation.delivery.delivered
            - com.medallia.survey.invitation.delivery.optout
          description: The specific message type
          example: com.medallia.survey.invitation.delivery.failed
        dataschema:
          type: string
          enum:
            - https://cdn.medallia.com/cloudevents-schemas/broadcaster-webhook-invitation-update/v1.json
        time:
          type: string
          format: date-time
          description: The timestamp of the message's creation
        datacontenttype:
          type: string
          enum:
            - application/json
          description: The MIME content type of the "data" payload
        subject:
          type: string
          description: An optional field that may be used for filtering or routing
        data:
          type: object
          required:
            - message_id
          properties:
            message_id:
              type: string
              format: uuid
              description: Must match the id value from the original DistributionRequest
            debug_info:
              oneOf:
                - type: object
                  description: Any additional information that could be helpful to debugging or tracing
                  additionalProperties: true
                  example:
                    masked_url: "https://survey.example.com"
                    contact_id: "abc123"
                - type: array
                  description: Any additional information that could be helpful to debugging or tracing
                  items:
                    type: object
                    additionalProperties: true
                    example:
                      masked_url: "https://survey.example.com"
                      contact_id: "abc123"
            error:
              type: object
              description: Only if the type is com.medallia.survey.invitation.delivery.failed
              required:
                - code
                - message
                - retryable
              properties:
                code:
                  type: string
                message:
                  type: string
                retryable:
                  type: boolean
    DistributionUpdateResponse:
      type: object
      required:
        - specversion
        - id
        - source
        - type
        - data
      properties:
        specversion:
          type: string
          enum:
            - "1.0"
          description: The version of the CloudEvents spec in use
        id:
          type: string
          format: uuid
          description: The ID of the message, guaranteed to be globally unique and idempotent
          example: 1f121945-b555-4813-aeb8-dc64610cb8e9
        traceparent:
          type: string
          description: Must match the traceparent value from the original DistributionRequest
          example: 00-5d3e8bdfa2b244caae0ff5d05be4e33d-597576596e36d40e-01
        source:
          type: string
          enum:
            - urn:medallia:services:broadcaster
          description: The identity of the system that sourced this message
        type:
          type: string
          enum:
            - com.medallia.survey.invitation.delivery.updatesuccess
            - com.medallia.survey.invitation.delivery.updateerror
          description: The specific message type
        dataschema:
          type: string
          enum:
            - https://cdn.medallia.com/cloudevents-schemas/broadcaster-webhook-invitation-update-response/v1.json
        time:
          type: string
          format: date-time
          description: The timestamp of the message's creation
        datacontenttype:
          type: string
          enum:
            - application/json
          description: The MIME content type of the "data" payload
        subject:
          type: string
          description: An optional field that can contain additional information helpful to track this message
        data:
          type: object
          description: The details of the survey invitation to distribute
          required:
            - status
          properties:
            error:
              type: object
              description: Only if the type is com.medallia.survey.invitation.delivery.failed
              properties:
                status:
                  type: string
                  enum:
                    - other
                    - invitation_not_found
            debug_info:
              oneOf:
                - type: object
                  description: Any additional information that could be helpful to debugging or tracing
                  additionalProperties: true
                  example:
                    external_ip: "1.2.3.4"
                    sys_log_rqst_id: "1234-5678-90abcdef"
                - type: array
                  description: Any additional information that could be helpful to debugging or tracing
                  items:
                    type: object
                    additionalProperties: true
                    example:
                      external_ip: "1.2.3.4"
                      sys_log_rqst_id: "1234-5678-90abcdef"
